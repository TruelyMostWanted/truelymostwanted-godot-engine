name: Feature request
description: Propose a new feature or an extension of an existing one.
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per **feature**, not per file or module. Steps and modules of a larger feature go into the
        checklist below or into comments. Keep it short: a new team member should understand it without
        reading the code.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should the feature do? One or two sentences.
      placeholder: ResourceLoader can list all resource paths below a directory, including those inside PCK files.
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current state
      description: What the engine does today and where it falls short. Point to the code (file:line). Self-contained, no links into private repositories.
      placeholder: ResourceLoader has no way to list resource paths; projects walk the file system by hand with DirAccess and miss files inside PCKs.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What changes and why it is better. Details belong in Scope and Technical notes.
      placeholder: ResourceLoader.list_resource_paths() returns all paths below a folder, including those inside PCK files.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What belongs to the feature, what explicitly does not? List modules or steps here.
      value: |
        **In scope**
        -

        **Out of scope**
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions. The feature is done when all boxes are checked.
      value: |
        - [ ]
        - [ ] Build succeeds without errors or warnings
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which parts of the project are affected?
      multiple: true
      options:
        - Core · core/ (Variant, Object, I/O, math)
        - Scene · scene/ (nodes, resources, GUI)
        - Servers · servers/ (rendering, physics, audio, navigation, text)
        - Editor · editor/
        - Modules · modules/ (GDScript, glTF, …)
        - .NET · modules/mono (C# bindings)
        - Platform & drivers · platform/, drivers/
        - Third-party · thirdparty/
        - Build & CI · SCons, .github/, misc/
        - Tests · tests/
        - Docs · doc/ (class reference)
    validations:
      required: true

  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Affected classes, source folders, bindings (GDScript/C#), file formats; dependencies on other issues.
      placeholder: |
        - New: `ResourceLoader::list_paths()` in core/io, bound to GDScript and C#
        - Depends on #12

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, commits, documents, mockups.
